name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew testDebugUnitTest

      - name: Compute next version
        if: github.event_name == 'push'
        id: version
        run: |
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          latest=${latest:-v1.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          echo "name=$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: github.event_name == 'push'
        run: ./gradlew assembleRelease -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ github.run_number }}

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ steps.version.outputs.name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "futsal-player-$VERSION.apk"
          gh release create "$VERSION" "futsal-player-$VERSION.apk" --target "$GITHUB_SHA" --generate-notes
